---
name: Mass Re-check Theme Requests
permissions: {}

on:
  workflow_dispatch:

jobs:
  mass_re_check:
    name: Re-check open theme requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Re-check theme requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          script: |
            const {recheckThemeRequests} = require('./src/github-scripts/mass-re-check-issues.js')
            const rechecked = await recheckThemeRequests({github, context})
            core.notice(`Re-checking ${rechecked} open theme request(s).`)
